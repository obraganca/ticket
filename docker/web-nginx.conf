server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: se o arquivo/rota pedida não existir fisicamente,
    # devolve o index.html e deixa o react-router-dom resolver a rota no
    # cliente. É isso que faltava e causava o 404 ao dar refresh em rotas
    # como /tickets/42.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ter cache longo com segurança.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
